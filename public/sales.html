<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>売上履歴 - Vulnerable Shop</title>
  <link rel="stylesheet" href="./styles.css"/>
  <style>
    .page-wrap{max-width:1100px;margin:24px auto;padding:0 16px}
    .card{background:#0f1b31;border:1px solid #27334d;border-radius:12px;padding:16px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #24314a}
    th{text-align:left;opacity:.9}
    .muted{opacity:.8}
    .pill{display:inline-block;padding:.1em .6em;border-radius:9999px;background:#0b1426;border:1px solid #2c3a59}
  </style>
</head>
<body>
<header>
  <nav class="navbar">
    <div class="nav-brand"><h1>🛒 Vulnerable Shop</h1></div>
    <div class="nav-links">
      <a href="./index.html">ホーム</a>
      <a href="./products.html">商品</a>
      <a href="./cart.html">カート<span id="cartCount" class="cart-badge">0</span></a>
      <a href="./java-vuln.html" style="color:#ffd700;font-weight:bold;">Java脆弱性デモ</a>
      <a href="http://127.0.0.1:5000/python-products/dashboard" target="_blank" class="btn btn-secondary" rel="noopener">Pythonダッシュボード</a>
      <div class="auth-buttons">
        <button id="loginBtn" class="btn btn-primary">ログイン</button>
        <button id="registerBtn" class="btn btn-secondary">新規登録</button>
        <button id="logoutBtn" class="btn btn-danger" style="display:none;">ログアウト</button>
        <span id="navUser" class="user-pill" hidden></span>
        <a id="profileLink" href="./profile.html" style="display:none;margin-left:8px;">プロフィール</a>
      </div>
    </div>
  </nav>
</header>

<main class="page-wrap">
  <h2>売上履歴 <span id="filterHint" class="pill muted"></span></h2>
  <div class="card" style="margin-top:12px">
    <div id="msg" class="muted" style="margin-bottom:10px;"></div>
    <div style="overflow:auto">
      <table id="tbl">
        <thead>
          <tr>
            <th style="width:180px">日時</th>
            <th>注文ID</th>
            <th>商品</th>
            <th style="width:120px">単価</th>
            <th style="width:80px">数量</th>
            <th style="width:120px">小計</th>
            <th style="width:140px">購入者</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="7" class="muted">読み込み中...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script src="./script.js" defer></script>
<script>
const $ = (selector) => document.querySelector(selector);

function fmtJPY(n){ return '¥' + Math.round(Number(n||0)).toLocaleString('ja-JP'); }
function setMsg(message, ok=false){ const el = $('#msg'); if(!el) return; el.textContent = message || ''; el.className = ok ? 'ok' : 'muted'; }

async function load(){
  const pid = new URLSearchParams(location.search).get('product');
  if (pid) $('#filterHint').textContent = `product=${pid}`;
  else $('#filterHint').textContent = 'all';

  try{
    const url = `/api/admin/sales-events${pid ? ('?product=' + encodeURIComponent(pid)) : ''}`;
    const res = await fetch(url, { credentials:'include' });
    if (res.status === 401){
      setMsg('Login required or insufficient privileges.');
      $('#rows').innerHTML = '<tr><td colspan="7">Unauthorized</td></tr>';
      return;
    }
    const list = await res.json();
    if(!res.ok) throw new Error((list && list.error) || res.statusText);

    if (!Array.isArray(list) || list.length===0){
      $('#rows').innerHTML = '<tr><td colspan="7" class="muted">No data available</td></tr>';
      return;
    }
    $('#rows').innerHTML = list.map(x=>{
      const dt = new Date(x.created_at || Date.now());
      const when = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      return `<tr>
        <td>${when}</td>
        <td style="font-family:monospace">${x.orderId}</td>
        <td><a href="./sales.html?product=${encodeURIComponent(x.productId)}">${x.productName||'(no name)'} <span class="pill muted">#${x.productId}</span></a></td>
        <td>${fmtJPY(x.unitPrice)}</td>
        <td>${x.qty}</td>
        <td>${fmtJPY(x.subTotal)}</td>
        <td>${x.buyer || ''}</td>
      </tr>`;
    }).join('');
    setMsg(`Total ${list.length} records`, true);
  }catch(e){
    console.error(e);
    setMsg('Failed to fetch data: ' + (e.message || e));
    $('#rows').innerHTML = '<tr><td colspan="7">Error</td></tr>';
  }
}

load();
</script>
</body>
</html>
